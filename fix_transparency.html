<!DOCTYPE html>
<html>
<head>
    <title>Fix Spritesheet Transparency</title>
</head>
<body>
    <h1>Fixing Spritesheet Transparency</h1>
    <p>This will remove the checkerboard pattern and make it transparent.</p>
    <canvas id="canvas"></canvas>
    <br>
    <a id="download" download="noe_spritesheet_fixed.png">Download Fixed Spritesheet</a>
    
    <script>
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function() {
            const canvas = document.getElementById('canvas');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            // The checkerboard pattern typically uses light grey (#C0C0C0 / 192,192,192) 
            // and white (#FFFFFF / 255,255,255) or similar shades
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // Detect checkerboard colors (grey ~192 and white ~255)
                // Light grey: around 192,192,192
                const isLightGrey = (r >= 185 && r <= 200) && (g >= 185 && g <= 200) && (b >= 185 && b <= 200);
                // White: around 255,255,255
                const isWhite = (r >= 250 && r <= 255) && (g >= 250 && g <= 255) && (b >= 250 && b <= 255);
                // Also check for the specific checkerboard shades (darker grey ~128)
                const isDarkGrey = (r >= 120 && r <= 140) && (g >= 120 && g <= 140) && (b >= 120 && b <= 140);
                
                if (isLightGrey || isWhite || isDarkGrey) {
                    // Make transparent
                    data[i + 3] = 0;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            
            // Create download link
            const link = document.getElementById('download');
            link.href = canvas.toDataURL('image/png');
            
            console.log('Done! Click the download link to save the fixed spritesheet.');
            document.body.innerHTML += '<p style="color:green; font-weight:bold;">Done! Click the download link above.</p>';
        };
        img.src = 'assets/noe_spritesheet.png';
    </script>
</body>
</html>
